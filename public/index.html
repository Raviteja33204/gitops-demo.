<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitOps Progressive Delivery Demo</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; max-width: 500px; }
    .status { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Application Status</h2>
    <p>Version: <span id="version">loading...</span></p>
    <p>Status: <span id="status" class="status">connecting...</span></p>
  </div>
  <script>
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('version').innerText = data.version;
        document.getElementById('status').innerText = data.status;
      });
  </script>
</body>
</html>
